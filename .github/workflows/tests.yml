name: tests
on: [push, pull_request]
jobs:
  test:
    # The full suite, with ffmpeg and ExifTool installed so video-making and settings-reading are tested too.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false            # one failing Python version shouldn't hide how the others did
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg libimage-exiftool-perl
      - run: pip install -e ".[dev,tiff,gui]"
      - run: pytest -q
  bare:
    # Without ffmpeg, ExifTool or the interface (Flet): every test that needs them must skip, never fail.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: pip install -e ".[dev]"
      - run: pytest -q
  windows:
    # James works on Windows: line endings, paths and file locking behave differently there.
    runs-on: windows-latest
    timeout-minutes: 30          # a hang fails within half an hour, not six
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: pip install -e ".[dev,tiff,gui]"
      - run: pytest -q
